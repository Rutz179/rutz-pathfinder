<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>러츠의 패스파인더 모험기</title>
<meta name="description" content="주말 패스파인더 파티의 입단 시험. 던전 끝까지 횃불을 지켜 보세요.">
<meta property="og:title" content="러츠의 패스파인더 모험기: 주말 파티 입단 시험">
<meta property="og:description" content="던전 끝까지 횃불을 지키면 디스코드로 가는 문이 열립니다.">
<meta property="og:url" content="https://rutz179.github.io/rutz-pathfinder/">
<meta property="og:image" content="https://rutz179.github.io/rutz-pathfinder/art/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="art/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough-edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/>
    </filter>
    <filter id="rough-line" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2a1d12" stroke-width="1.3" opacity=".75"/>
    </pattern>
  </defs>
</svg>

<main id="app" aria-live="polite"></main>
<aside id="gm" hidden></aside>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
